<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅방</title>
  <link rel="stylesheet" href="./chat_room.css" />
</head>
<body>
  <div id="chat">
    <h3 id="channelName"></h3>
    <div class="chat-container">
      <div class="chat-main">
        <div id="messages"></div>
        <div>
          <input type="text" id="to" placeholder="귓속말 대상(없으면 전체)">
          <input type="text" id="message" placeholder="메시지를 입력하세요">
          <select id="channelSelector">
            <option value="lobby">대기실</option>
            <option value="sports">스포츠</option>
            <option value="programming">프로그래밍</option>
            <option value="music">음악</option>
          </select>
          <button id="emoji">⭐</button>
          <div id="emojiBox">
            <span>😁</span>
            <span>😂</span>
            <span>🤣</span>
            <span>😃</span>
            <span>😆</span>
            <span>😎</span>
            <span>😐</span>
            <span>😑</span>
            <span>🙄</span>
            <span>😣</span>
          </div>
          <button id="send">전송</button>
        </div>
      </div>
      <div id="users">
        <h4>접속자 목록</h4>
        <div id="userCounts"></div>
        <div id="userList"></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io()

      console.log("클라이언트 소캣 생성 성공")
      // console.log(socket)

      const nickname = localStorage.getItem("nickname")
      let currentChannel = localStorage.getItem("channel")

      if(!nickname || !currentChannel) {
        alert("닉네임 또는 채널 정보가 존재하지 않습니다.")
        location.href = "chat_index.html"
      }

      // 상단에 현재 접속 채널 제목 표기
      const channelName = document.getElementById("channelName")
      channelName.textContent = `[채널: ${currentChannel}]`

      // 하단에 현재 접속 채널 표기
      const channelSelector = document.getElementById("channelSelector")
      channelSelector.value = currentChannel

      // join 이벤트 발생시키기 (서버로)
      socket.emit("join", { nickname, channel: currentChannel})

      // 귓속말 할 대상
      const toInput = document.getElementById("to")
      // 메시지 입력창
      const messageInput = document.getElementById("message")
      // emoji 팝업 버튼
      const emojiPopUpButton = document.getElementById("emoji")
      // emojiBox 팝업 창
      const emojiPopUpBox = document.getElementById("emojiBox")

      messageInput.addEventListener("keydown", (e) => {
        if(e.key === "Enter") sendMessage()
      })
    
      document.getElementById("send").onclick = sendMessage

      function sendMessage() {
        console.log(messageInput.value)
        const text = messageInput.value.trim()
        const to = toInput.value.trim()

        if(text) {
          console.log("sendMessage: ", text, to)
          //chat 이벤트를 서버로 발생
          socket.emit("chat", { text, to: to || null })
          messageInput.value = ""
        }
      }

      channelSelector.onchange = () => {
        const newChannel = channelSelector.value
        if(newChannel !== currentChannel) {
          socket.emit("changeChannel", { newChannel })
          currentChannel = newChannel
          channelName.textContent = `[채널: ${currentChannel}]`
          messages.innerHTML = ""
          localStorage.setItem("channel", currentChannel)
        }
      }

      // 서버에서 message 이벤트가 왔다면
      socket.on("message", ({ user, text}) => {
        console.log(" === 서버로부터 message 이벤트 호출 === ")
        console.log("user:", user)
        console.log("text:", text)

        const div = document.createElement("div")
        div.textContent = `[${user}] ${text}`
        if (user === "system") div.classNAme = "system-msg"

        messages.appendChild(div)
        messages.scrollTop = messages.scrollHeight
      })

      // 서버에서 whisper 이벤트가 왔다면
      socket.on("whisper", ({ user, text }) => {
        console.log(" === 서버로부터 whisper 이벤트 호출 === ")
        console.log("user:", user)
        console.log("text:", text)

        const div = document.createElement("div")
        div.textContent = `[귓속말] [${user}] ${text}`
        
        div.style.color = "deeppink"

        messages.appendChild(div)
        messages.scrollTop = messages.scrollHeight
      })
    
      // 버튼 눌리면 display 나오게 설정하기 (위치는 css로 설정하기)
      let emojiPopUpVisible = false
      emojiPopUpButton.addEventListener("click", (e) => {
        // 보이거나 보이지 않음을 설정해주기 (토글)
        console.log(emojiPopUpBox.style.display)
        emojiPopUpBox.style.display = emojiPopUpVisible ? "none" : "block"
        emojiPopUpVisible = !emojiPopUpVisible

        // 버튼의 크기 객체
        const rect = emojiPopUpButton.getBoundingClientRect();
        const boxRect = emojiPopUpBox.getBoundingClientRect()
        console.log(rect)
        const moveX = boxRect.width / 2

        // 위치 조절해주기
        emojiPopUpBox.style.position = "absolute"
        emojiPopUpBox.style.left = `${rect.left - moveX}px`
        emojiPopUpBox.style.top = `${rect.y - boxRect.height - 8}px`
      })
    
      emojiPopUpBox.addEventListener("click", (e) => {
        if(e.target.tagName === "SPAN") {
          // console.log(event.target.textContent)
          messageInput.value += event.target.textContent
        }
      })
    

      const userCounts = document.getElementById("userCounts")
      const userList = document.getElementById("userList")
      socket.on("userList", (list) => {
        console.log(list)

        // 채널별 접속자 수 
        const channelMap = {}
        list.forEach(({ nickname, channel }) => {
          if(!channelMap[channel]) channelMap[channel] = 0
          channelMap[channel]++
        })

        userCounts.innerHTML = "<strong>채널별 접속자 수</strong>" 
                + Object.entries(channelMap).map(([ch, count]) => `${ch}: ${count}명`).join("<br>")
        
        // 접속자 명단
        // 본인의 채널만 뽑아서 보여주기
        const currentChannelUsers = []
        list.forEach(({ nickname, channel }) => {
          console.log("currentChannel", currentChannel)
          console.log("channel", channel)
          if(currentChannel === channel) {
            currentChannelUsers.push(`<div onclick="whispherTo('${nickname}')"><span class="online-dot"></span>` + nickname + "</div>")
          }
        })

        userList.innerHTML = `<strong>${currentChannel} 접속자 명단</strong><br>` + currentChannelUsers

      })

      function whispherTo(nickname) {
        toInput.value = nickname
      }
    </script>
  </div>
</body>
</html>

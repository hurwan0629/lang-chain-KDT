<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6단계 - CSS 변수와 우선순위</title>
  <style>
    :root {
      /* 과제 1: 아래 변수 3개를 선언하세요.
         --main-color: #2563eb
         --card-padding: 24px
         --title-size: 26px */
      --main-color: #2563eb;
      --card-padding: 24px;
      --title-size: 26px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
    }

    .card {
      max-width: 500px;
      margin-bottom: 20px;

      /* 과제 2: 변수로 테두리 색상과 안쪽 여백을 설정하세요. */
      border: 3px solid var(--main-color, black);
      background-color: white;

      padding: var(--card-padding, 10px);
    }

    .card h2 {
      /* 과제 3: 변수로 글자 색상과 크기를 설정하세요. */
      color: var(--main-color);
      font-size: var(--title-size, 20px);
    }

    .green-theme {
      /* 과제 4: 이 카드 안에서 --main-color를 #16a34a로 재정의하세요. */
      --main-color: #16a34a
    }

    /* 우선순위 실험 */
    p {
      color: blue;
    }

    .message {
      color: green;
    }

    #important-message {
      color: red;
    }
  </style>
</head>
<body>
  <section class="card">
    <h2>기본 테마</h2>
    <p>CSS 변수로 색상과 여백을 관리합니다.</p>
  </section>

  <section class="card green-theme">
    <h2>초록 테마</h2>
    <p>이 카드 안에서만 변수값이 변경됩니다.</p>
  </section>

  <section class="card">
    <h2>우선순위 실험</h2>
    <p id="important-message" class="message">
      이 문장의 최종 색상을 먼저 예상해 보세요.
    </p>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7단계 - Transition과 Transform</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
    }

    .button {
      padding: 14px 24px;
      border: 0;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;

      /* 과제 1: 배경색 변화를 0.3초 동안 부드럽게 만드세요. */
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #1e40af;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      min-height: 180px;
      padding: 24px;
      border-radius: 12px;
      background-color: white;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      cursor: pointer;

      /* 과제 2: transform과 box-shadow 변화를 설정하세요. */
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .card:hover {
      /* 과제 3: 위로 10px 이동하고 1.05배 확대하세요. */
      transform: translateY(-10px) scale(1.05);

      /* 과제 4: 그림자를 더 진하고 크게 변경하세요. */
      box-shadow: 0 14px 25px rgba(0, 0, 0, 0.25);
    }

    .rotate:hover {
      /* 과제 5: 위 효과에 3도 회전을 추가하세요. */
      transform: translateY(-10px) scale(1.05) rotate(3deg)
    }
  </style>
</head>
<body>
  <h1>Transition과 Transform</h1>

  <button class="button">마우스를 올려보세요</button>

  <section class="card-list">
    <article class="card">
      <h2>이동과 확대</h2>
      <p>translate와 scale을 사용합니다.</p>
    </article>

    <article class="card rotate">
      <h2>이동, 확대, 회전</h2>
      <p>여러 transform 함수를 함께 사용합니다.</p>
    </article>

    <article class="card">
      <h2>그림자 변화</h2>
      <p>여러 CSS 속성을 동시에 전환합니다.</p>
    </article>
  </section>
</body>
</html>

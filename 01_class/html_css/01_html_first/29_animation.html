<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation</title>
  <style>

    @keyframes toastIn {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .toast {
      width: 360px;
      border: 2px solid #000;
      padding: 16px;
      margin-bottom: 30px;

      animation-name: toastIn;
      animation-duration: 0.6s;
      animation-timing-function: ease-out;
      animation-delay: 0.2s;
      animation-fill-mode: forwards;
      opacity: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(1440deg);}
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 6px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      margin-bottom: 30px;

      animation: spin 2s linear 0s infinite normal none;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1;}
    }

    .badge {
      display: inline-block;
      border: 2px solid #000;
      padding: 8px 12px;

      animation: pulse 0.4s ease-in-out 0s infinite alternate none;
    }

    .pause-hint {
      margin-top: 10px;
      font-size: 14px;
    }

    .badge:hover {
      cursor: pointer;
      animation-play-state: paused;
    }

    h2 {
      margin: 20px 0 10px;
    }
  </style>
</head>
<body>
  <!--
    animation
    @keyframes 이용해 여러 단계의 스타일 변화를 정의하고 이를 자동으로 재생하는 기능으로, 사용자 상호작용이 없어도 시간의 흐름에 따라 요소가 움직이거나 변형되도록 만들 수 있음

    # 애니메이션을 만들기
    @keyframes 애니메이션이름 {
      단계 {
        스타일;
      }
    }

    예)
    # 쉬운방식
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      25% { transform: translateY(-50); }
      50% { transform: translateY(-10); }
      75% { transform: translateY(20); }
      100% { transform: translateY(0); }
    }

    ---

    animation-name
    animation-name: fade # 적용할 keyframes 이름 적용

    animation-duration # 애니메이션이 실행되는 시간
    animation-duration: 2s;

    animation-timing-function # 애니메이션 속도 변화 방식
    animation-timing-function: ease-in-out

    animation-delay # 애니메이션 시작 전 대기시간
    animation-delay: 1s;

    animation-iteration-count # 반봇 횟수
    animation-iteration-count: infinite; # 또는 숫자

    animation-direction # 재생 방향
    animation-direction: altername;
    재생 방향. forward(앞으로), alternate(앞으로 뒤로)

    animation-fill-mode # 시작/종료 후 스타일 유지 여부
    animation-fill-mode: forwards;

    animatin-play-state # 애니메이션 재생 및 정지
    animatin-play-state: paused; # 또는 paused

    animation: name duration timing delay iteratin-count direction fill-mode; 순서
  -->

  <h2>토스트(알림) 등장</h2>
  <div class="toast">
    저장되었습니다! (0.2초 후 부드럽게 등장)
  </div>
  <div class="spinner"></div>

  <h3>강조 배지 (펄스)</h3>
  <div class="badge">HOT</div>
  <div class="pause-hint">배지에 마우스를 올리면 애니메이션이 멈춥니다.</div>
</body>
</html>

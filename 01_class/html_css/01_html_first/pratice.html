<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0px;
      padding: 0px;
    }
    html, body, body > div {
      height: 100%;
    }
    header {
      background-color: #334155;
      height: 10%;
    }
    .main {
      background-color: #e2e8f0;
      height: 80%;
      padding: 20px;
    }
    article {
      float: left;
      background-color: #bfdbfe;
      height: 80%;
      width: 70%;
      padding: 20px;
      border-radius: 10%;
    }

    aside {
      float: right;
      background-color: #fde68a;
      height: 80%;
      width: 20%;
      padding: 20px;
      border-radius: 10%;
    }

    footer {
      height: 10%;
      background-color: #64748b;
    }
  </style>
</head>
<body>
  <div>
    <header>
      헤더
    </header>
    <div class="main">
        <article>
          내용입니다.
        </article>
        <aside>
          사이드바 입니다.
        </aside>
    </div>
    <footer>
      푸터
    </footer>
  </div>
  
</body>
</html>

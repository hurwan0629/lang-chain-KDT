[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-moe-lab"
version = "0.1.0"
description = "A local, from-scratch educational MoE language model lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch==2.5.1", "numpy==2.1.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

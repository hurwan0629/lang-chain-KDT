    <!-- Canonical -->
    <script>
      try {
        /* useAppEffect */
        // const canonicalUrl = 'https://www.banapresso.com';
        const getCookie = (key) => {
          const cookieKey = `${key}=`;
          let result = '';
          const cookieArr = document.cookie.split(';');

          for (let i = 0; i < cookieArr.length; i++) {
            if (cookieArr[i][0] === ' ') {
              cookieArr[i] = cookieArr[i].substring(1);
            }

            if (cookieArr[i].indexOf(cookieKey) === 0) {
              result = cookieArr[i].slice(cookieKey.length, cookieArr[i].length);
              return result;
            }
          }
          return result;
        };
        const setCookie = (name, value, expiredays) => {
          const todayDate = new Date();
          todayDate.setDate(todayDate.getDate() + expiredays);
          document.cookie = `${name}=${encodeURI(value)}; path=/; expires=${todayDate.toUTCString()};`;
        };
        const getIsMobileDevice = (x) => {
          const mobileExp =
            /Android|webOS|iPhone|iPad|iPod|BlackBerry|Windows CE|LG|MOT|SAMSUNG|SonyEricsson|Windows Phone|Opera Mini|IEMobile|Mobile/i;

          return mobileExp.test(x);
        };

        // ì¬ì©ì ë¡ê·¸ ê¸°ë¡ì© key
        // const userKey = getCookie('bana_user_log');
        // if (!userKey) document.cookie = `bana_user_log=USER_${new Date().getTime()}; max-age=3600`;
        // ì¿ í¤ -> ë¡ì»¬ì¤í ë¦¬ì§ë¡ ë³ê²½ (ê¸°ì¡´ ê° ìì¼ë©´ ì¿ í¤ìì ê°ì ¸ì´)
        const userKey = localStorage.getItem('bana_user_log');
        if (!userKey) {
          if (!!getCookie('bana_user_log')) localStorage.setItem('bana_user_log', getCookie('bana_user_log'));
          else localStorage.setItem('bana_user_log', `USER_${new Date().getTime()}`);
        }

        // so íë¼ë¯¸í° ì²ë¦¬ (redirect from banapres.so)
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.has('so')) {
          const soVal = searchParams.get('so');
          // so=0ì´ë©´ ê¸°ë³¸, ê·¸ ì¸ìë ?so=soVal íìì¼ë¡ ì ì¥
          if (soVal === '0') {
            sessionStorage.setItem(localStorage.getItem('bana_user_log'), 'http://banapres.so');
          } else {
            sessionStorage.setItem(localStorage.getItem('bana_user_log'), `http://banapres.so/${soVal}`);
          }
        } else {
          sessionStorage.setItem(localStorage.getItem('bana_user_log'), document.referrer);
        }

        if (getCookie('pcT') === 'Y') {
          setCookie('pcT', '', -1);
        } else {
          const privacyPolicyUrl = {
            '/privacy': '/policy/banapresso_privacy',
            '/companyPrivacy': '/policy/company_privacy',
            '/termsofservice': '/policy/termsofservice',
            '/termsofgift': '/policy/termsofgift',
            '/termsofpoint': '/policy/termsofpoint',
          };
          const redirectToModifiedUrl = {
            '/qr/scan/partner': '/franchise_inquiry',
            '/qr/scan/rent': '/franchise/rent',
            '/qr/scan/recruit': '/view/recruit',
            '/qr/scan/biz': '/biz/info',
            '/qr/scan/menu_new': '/menu/new',
            '/qr/scan/voc': '/view/voc/qr',
          };
          const stayInWebUrl = [
            '/gift',
            '/menuInfo',
            '/app/download',
            '/app_install',
            '/menu_introduction',
            '/home',
            '/store',
          ];

          const handlePath = () => {
            let pathname = window.location.pathname;
            if (Object.keys(privacyPolicyUrl).includes(`${pathname}`)) {
              pathname = privacyPolicyUrl[`${pathname}`];
            } else if (Object.keys(redirectToModifiedUrl).includes(`${pathname}`)) {
              pathname = redirectToModifiedUrl[`${pathname}`];
            }
            return pathname;
          };

          if (getIsMobileDevice(navigator.userAgent)) {
            const orgPath = window.location.pathname;
            const path = handlePath();

            if (orgPath.includes('/qr/scan')) {
              if (path.includes('/partner_')) {
                const indexOfPartner = window.location.href.indexOf('partner_');
                const search = window.location.href.substring(indexOfPartner + 8);

                window.location.href = '/franchise/partner?path=' + search;
              }
              // ê³ ê°ì ìë¦¬ ì¹ë·°
              else if (orgPath.includes('voc')) {
                const fCode = window.location.search.replace('?fcode=', '');
                window.location.href = `${path}/${fCode}`;
              } else if (Object.keys(redirectToModifiedUrl).some((el) => orgPath.includes(el))) {
                window.location.href = path + (path.includes('biz') ? '' : window.location.search);
              }
            } else if (Object.keys(privacyPolicyUrl).some((el) => orgPath.includes(el))) {
              window.location.href = '/m' + path;
            } else if (
              path !== '/' &&
              path !== '/franchise/tax' &&
              !path.includes('/m') &&
              !stayInWebUrl.includes(path)
            ) {
              window.location.href = '/m' + path + window.location.search;
            }
          }
        }
      } catch (e) {}
    </script>

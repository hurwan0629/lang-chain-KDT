<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Simple Example</title>
  <style>
    video {
      width: 300px;
      background: black;
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1>WebRTC 로컬 테스트</h1>

  <button id="startBtn">WebRTC 연결 시작</button>

  <div>
    <div>
      <h3>Local Video</h3>
      <!-- iPhone Safari 에서 자동으로 전체화면 실행을 막기 위해 playsinline 속성 추가. 기본적으로 자동으로 실행되게 하기(autoplay). -->
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div>
      <h3>Remote Video</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <pre id="log"></pre>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // 시작하기 버튼
    const startBtn = document.querySelector("#startBtn");
    // 현재 내 비디오 (autoplay playsinline muted)
    const localVideo = document.querySelector("#localVideo");
    /// 상대 비디오 (autoplay playsinline)
    const remoteVideo = document.querySelector("#remoteVideo");
    // pre 태그로 뭔가 로그를 찍는 것으로 보임
    const logBox = document.querySelector("#log");

    const socket = io()

    socket.on("room_full", () => {
      alert("방이 가득 찼습니다!")
    })

    // 상대가 나가면 정리해주기
    socket.on("other-disconnect", () => {
      remoteVideo.srcObject = undefined
    })

    // 로그에 작성할 것인가 봄. (메시지?)
    function log(message) {
      console.log(message);
      logBox.textContent += message + "\n";
    }
    log(location.href);
    log(window.isSecureContext);
    log(navigator.mediaDevices);

    socket.on("connect", () => {
      log("socket connected: " + socket.id);
    });

    socket.on("connect_error", (error) => {
      log("socket connect_error: " + error.message);
    });

    // 시작 시 이벤트 추가해주기 (비동기)
    // 다른 작업에 영향을 주지 않기 위해 이렇게 하는것으로 보임 (대기 시간이 걸릴 수 있나봄)
    startBtn.addEventListener("click", async () => {
      log("1. 카메라/마이크 권한 요청");

      try {
      const stream = await navigator  // 브라우저 환경 정보를 담고있는 전역 객체
                          .mediaDevices // 네비게이터중에서도 미디어 관련 장치를 가지고 있는 객체
                          .getUserMedia({ // 사용자의 video, audio (카메라와 음성인식) 권한을 요청하고 반환하는 메서드
                            video: true,  // 반환값은 `MediaStream` 임
                            audio: true
                          });
      // console.log(await navigator.mediaDevices.enumerateDevices())

      // MediaStream 객체를 받은 뒤 이를 localVideo의 .srcObject 속성에 넣어주기 
      localVideo.srcObject = stream;

      log("2. RTCPeerConnection 2개 생성");

      // RTCPeerConnection 은 P2P 연결을 만들기 위한 객체
      // RTCPeerConnection
      //   ├─ 보낼 track 정보
      //   ├─ 받을 track 처리
      //   ├─ ICE candidate 목록
      //   ├─ STUN/TURN 서버 설정
      //   ├─ offer / answer 정보
      //   ├─ 선택된 연결 경로(IP/포트/프로토콜)
      //   └─ 연결 상태 관리
      const localPeer = new RTCPeerConnection({
        iceServers: [
          {   // 구글의 공개 STUN 서버 사용하기 (대칭 NAT같은 경우에는 제대로 작동하지 않을 수 있어보임)
              // turn 서버의 경우에는 향후 구현해서 쓰는걸로
              // stun 서버의 경우에도 나중에 직접 한번 구현해보면 좋을듯
            urls: "stun:stun.l.google.com:19302"
          }
        ]
        
      });

      log("3. ICE Candidate 서로 전달 설정");

      socket.on("ice_candidate", (candidate) => {
        localPeer.addIceCandidate(candidate);  // 서버가 연결할 후보 알려주면 추가해주기
      })
      // RTCPeerConnection의 onicecandidate라는 연결 가능한 주소 후보(Peer)이 생길 때마다 발생하는 이벤트 핸들러
      // addEventListener
      localPeer.onicecandidate = event => {
        if (event.candidate) { // 후보자가 존재하지 않을(null)수도 있어서 한번 확인해주기
          // 여기에서 candidate란 나의 로컬IP, 공인IP:포트, TURN 서버 등과 같은 주소를 말함
          socket.emit("ice_candidate", event.candidate)
        }
      };
      
      // 위와 동일한 작업 진행해주기

      log("4. remotePeer가 영상 트랙을 받으면 remoteVideo에 표시");

      // remotePeer은 상대가 원격으로 넣어주는 자료를 의미함.
      // 여기에서 ontrack라는 이벤트는 외부에서 넣어주는 stream(MediaStream이라는 객체들의 배열)인데 배열인 이유는 
      // 여러 스트림으로 나누어 들어올 수 있기 때문임 (여러 카메라나 상대가 인위적으로 나누는 경우)
      localPeer.ontrack = event => {
        remoteVideo.srcObject = event.streams[0];
        log("remotePeer가 영상 스트림 수신");
      };

      log("5. localPeer에 카메라/마이크 트랙 추가");

      // 가져온 track(미디어 흐름 객체 단위)
      stream.getTracks().forEach(track => {
        localPeer.addTrack(track, stream);
      });

      log("6. localPeer가 offer 생성");
      // offer은 자신이 가능한 데이터의 형태를 문서로 만든 것
      const offer = await localPeer.createOffer(); //.createOffer() - 나의 인코딩/디코딩/암호화 등등의 정보
      console.log(offer)
      await localPeer.setLocalDescription(offer); // 자신의 객체에 등록해주기 (상대가 answer을 요청하면 이거로 응답해주려고)

      // log("7. offer를 서버(다른 클라이언트)에게 전달");
      // 자신의 요구사항 보내기 전에 응답 받을 준비 해두기
      socket.on("rtc_offer_response", async (answerData) => {
        // setRemoteDescription(anwerData)
        await localPeer.setRemoteDescription(answerData)
      })
      await socket.emit("rtc_offer", offer)
      // await remotePeer.setRemoteDescription(offer);

      log("8. remotePeer answer 생성");

      // const answer = await remotePeer.createAnswer();
      // await remotePeer.setLocalDescription(answer);

      log("9. answer를 localPeer에게 전달");

      // await localPeer.setRemoteDescription(answer);

      log("10. WebRTC 연결 완료");

      // 서버에서 다른 클라이언트가 offer을 주었을 때 자신의 answer 응답하게 설정해두기
      socket.on("offered", async (remoteOffer) => {
        localPeer.setRemoteDescription(remoteOffer)
        const answerOfOffer = await localPeer.createAnswer()

        await localPeer.setLocalDescription(answerOfOffer);
        // 응답 만들어서 보내주기
        socket.emit("answer", answerOfOffer)
      })
      } catch (error) {
        console.error(error);
        log(error.name + ": " + error.message);
      }
    });

    
  </script>
</body>
</html>

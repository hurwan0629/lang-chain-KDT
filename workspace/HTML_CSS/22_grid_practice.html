<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Grid 전체 예제</title>

  <style>
    .container {
      width: 900px;
      height: 600px;
      border: 3px solid black;

      /* Grid 시작 */
      display: grid;

      /* 열의 개수와 크기 설정 */
      grid-template-columns: 1fr 2fr 1fr;
      /*
        1fr 2fr 1fr:
          3개의 열을 만든다.
          남는 공간을 1 : 2 : 1 비율로 나눈다.

        100px 200px 100px:
          고정 크기 열 3개 생성

        repeat(3, 1fr):
          1fr 1fr 1fr과 동일

        repeat(auto-fit, minmax(200px, 1fr)):
          반응형 그리드에서 자주 사용
      */

      /* 행의 개수와 크기 설정 */
      grid-template-rows: 80px 1fr 80px;
      /*
        80px 1fr 80px:
          3개의 행을 만든다.
          첫 번째 행 80px
          두 번째 행은 남는 공간
          세 번째 행 80px

        auto 200px:
          첫 번째 행은 내용 크기만큼
          두 번째 행은 200px

        repeat(3, 100px):
          100px짜리 행 3개 생성
      */

      /* 영역 이름으로 레이아웃 설계 */
      grid-template-areas:
        "header header header"
        "nav    main   aside"
        "footer footer footer";
      /*
        큰따옴표 하나가 한 행을 의미한다.

        "header header header"
          첫 번째 행 전체를 header가 차지

        "nav main aside"
          두 번째 행은 nav, main, aside로 나뉨

        "footer footer footer"
          세 번째 행 전체를 footer가 차지
      */

      /* 행과 열 사이 간격 */
      gap: 20px;
      /*
        gap: 20px;
          행과 열 간격 모두 20px

        row-gap: 20px;
          행과 행 사이 간격

        column-gap: 20px;
          열과 열 사이 간격

        gap: 10px 30px;
          행 간격 10px, 열 간격 30px
      */

      /* 각 셀 안에서 아이템의 가로 방향 정렬 */
      justify-items: stretch;
      /*
        stretch:
          기본값, 아이템이 셀의 가로폭을 채움

        start:
          셀의 왼쪽에 붙음

        center:
          셀의 가로 중앙에 위치

        end:
          셀의 오른쪽에 붙음
      */

      /* 각 셀 안에서 아이템의 세로 방향 정렬 */
      align-items: stretch;
      /*
        stretch:
          기본값, 아이템이 셀의 세로 높이를 채움

        start:
          셀의 위쪽에 붙음

        center:
          셀의 세로 중앙에 위치

        end:
          셀의 아래쪽에 붙음
      */

      /* align-items + justify-items 축약 */
      /* place-items: stretch; */
      /*
        place-items: center;
          align-items: center;
          justify-items: center;

        place-items: start end;
          align-items: start;
          justify-items: end;

        값이 하나면 세로/가로 둘 다 같은 값 적용
        값이 두 개면 세로, 가로 순서로 적용
      */
    }

    .item {
      background-color: lightblue;
      border: 2px solid blue;
      font-size: 24px;
      padding: 20px;
      text-align: center;
    }

    .header {
      grid-area: header;
      /*
        grid-template-areas에서 정한 header 영역을 차지함
      */

      background-color: lightcoral;
    }

    .nav {
      grid-area: nav;
      background-color: lightgreen;
    }

    .main {
      grid-area: main;
      background-color: lightyellow;

      /* 특정 아이템 하나만 가로 방향 정렬 */
      justify-self: stretch;
      /*
        stretch:
          셀의 가로폭을 채움

        start:
          셀의 왼쪽에 붙음

        center:
          셀의 가로 중앙에 위치

        end:
          셀의 오른쪽에 붙음
      */

      /* 특정 아이템 하나만 세로 방향 정렬 */
      align-self: stretch;
      /*
        stretch:
          셀의 세로 높이를 채움

        start:
          셀의 위쪽에 붙음

        center:
          셀의 세로 중앙에 위치

        end:
          셀의 아래쪽에 붙음
      */

      /* align-self + justify-self 축약 */
      /* place-self: center; */
      /*
        place-self: center;
          align-self: center;
          justify-self: center;

        place-self: start end;
          align-self: start;
          justify-self: end;
      */
    }

    .aside {
      grid-area: aside;
      background-color: lightpink;
    }

    .footer {
      grid-area: footer;
      background-color: lightgray;
    }

    .box1 {
      /*
        grid-column은 가로 방향에서
        몇 번째 선부터 몇 번째 선까지 차지할지 정한다.
      */
      grid-column: 1 / 3;
      /*
        1 / 3:
          1번 세로선에서 시작해서 3번 세로선 전까지 차지
          즉, 1열 + 2열을 차지함

        1 / 4:
          1번 세로선부터 4번 세로선 전까지
          즉, 3칸 차지

        span 2:
          현재 위치부터 2칸 차지
      */

      /*
        grid-row는 세로 방향에서
        몇 번째 선부터 몇 번째 선까지 차지할지 정한다.
      */
      grid-row: 1 / 2;
      /*
        1 / 2:
          1번 가로선에서 시작해서 2번 가로선 전까지 차지
          즉, 1행 차지

        1 / 3:
          1행 + 2행 차지

        span 2:
          현재 위치부터 2행 차지
      */
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="item header">Header</header>
    <nav class="item nav">Nav</nav>
    <main class="item main">Main</main>
    <aside class="item aside">Aside</aside>
    <footer class="item footer">Footer</footer>
  </div>
</body>
</html>

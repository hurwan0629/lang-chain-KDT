<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      height: 200px;
      width: 100%;

      border: 2px solid #000;
      gap: 20px;
      
    }

    .box {
      padding: 4px;
      border: 2px solid green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
  </div>
</body>
</html>

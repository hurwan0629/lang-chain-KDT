<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 폰트는 귀여운 고양체로 설정
    https://noonnu.cc/font_page/79#google_vignette */
    
    @font-face {
        font-family: 'Goyang';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Goyang.woff') format('woff');
        font-weight: normal;
        font-display: swap;
    }

    :root {
      --header-height: clamp(80px, 12vh, 120px)
    }

    * {
      box-sizing: border-box;
      margin: 0px;
      padding: 0px;
      
      font-family: "Goyang";
    }

    
    .container-root {
      display: flex;
      flex-direction: column;

      background-color: blanchedalmond;
      
      /* vh는 viewport height */
      height: 100vh;
      /* 부모요소의 너비를 그대로 사용 */
      width: 100%;
    }

    header {
      height: var(--header-height);

      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: space-between;
      grid-template-columns: repeat(auto-fit, 1fr);
      background-color: rgb(185, 152, 112);
      
    }
  
    header > p {
      width: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    nav {
      width: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      flex: 1;

      display: grid;
      grid-template-columns: 5fr 1fr;
      grid-template-areas: "contents sidebar";

      padding: 10px;
    }

    aside {
      grid-area: sidebar;

      position: sticky;

      right: 8px;
      top: calc(var(--header-height) + 30px);
      height: clamp(60px, 60vh, 1200px);
      width: 100%;
      
      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: start;

      padding-top: 12px;
      padding: 4px;

      border-radius: 5%;

      background-color: cadetblue;
    }

    aside > * {
      padding-top: 10px;
    }

    #contents {
      height: 100%;
      grid-area: contents;

      padding: 10px;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      grid-auto-rows: max-content;
      gap: 16px;

    }

    .card {
      border: 1px solid #000;
      border-radius: 5%;

      width: 100%;
      aspect-ratio: 4/5;


      background-color: rgb(203, 234, 176);
      overflow: hidden;
      /* 그림자가 너무 찐함 ; */
      /* box-shadow: 4px 4px 30px; */

      transition: 
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 25px rgba(201, 186, 165, 0.977);
    }

    .card > h4, p {
      margin: 10px
    }
  
    .card > p {
      font-size: 12px;
      opacity: 0.8;
      color: gray;
    }

    .container-img {
      width: 100%;
      height: 60%;
      overflow: hidden;

      border-bottom: 1px solid #000;
    }

    .container-img > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    footer {
      position: fixed;

      bottom: 0;

      width: 100%;
      height: calc(var(--header-height)/2);

      background-color: rgb(125, 103, 89);
    }


  </style>
</head>
<body>

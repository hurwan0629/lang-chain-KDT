<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table</title>
  <style>
    table {
      width: 600px;
      border-collapse: collapse;
    }

    thead {
      background-color: cadetblue;
    }

    tbody td {
      padding: 12px;
      border-bottom: 1px solid #c30b0b;
      border: 2px solid;
    }

    tbody td:hover {
      background-color: aquamarine;
    }
  </style>
</head>
<label>hello</label>
<body>
  <table width="50%" border="2" > <!-- border="1" -->
    <thead>
      <tr>
        <th>a</th>
        <th>b</th>
        <th>c</th>
      </tr>
    </thead>
    <tbody>
        <tr>
          <td>a</td>
          <td colspan="2">2</td>
        </tr>
        <tr>
          <td>a</td>
          <td>2</td>
          <td>3</td>
        </tr>
        <tr>
          <td>a</td>
        <td>2</td>
        <td>3</td>
      </tr>
      <tr>
        <td>a</td>
        <td>2</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>
  <br><hr>
</body>
</html>

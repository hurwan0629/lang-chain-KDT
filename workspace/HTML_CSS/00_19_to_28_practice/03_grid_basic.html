<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3단계 - Grid 기초</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f5f7fb;
    }

    .guide {
      max-width: 800px;
      padding: 16px;
      margin-bottom: 24px;
      border-left: 5px solid #7c3aed;
      background-color: white;
      line-height: 1.7;
    }

    .container {
      width: 800px;
      min-height: 450px;
      padding: 20px;
      border: 3px solid #222;
      background-color: white;

      /* 과제 1: 이 요소를 Grid 컨테이너로 만드세요. */
      display: grid;
      /* 과제 2: 같은 크기의 열 3개를 만드세요. */
      grid-template-columns: 1fr 2fr 1fr;
      /* 과제 3: 행과 열 사이에 20px 간격을 만드세요. */
      gap: 20px;
    }

    .item {
      min-height: 140px;
      padding: 20px;
      border: 2px solid #6d28d9;
      background-color: #c4b5fd;
      font-size: 28px;
      font-weight: bold;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 과제 4: 1번 상자가 첫 번째 열부터 세 번째 열 직전까지 차지하게 만드세요. */
    .item:first-child {
      grid-column: 1 / 3;
    }
  </style>
</head>
<body>
  <h1>Grid 기초 실습</h1>

  <div class="guide">
    <strong>한 번에 진행할 과제</strong><br>
    1. Grid를 시작하세요.<br>
    2. 같은 크기의 열 3개를 만드세요.<br>
    3. 상자 사이에 20px 간격을 만드세요.<br>
    4. 1번 상자가 가로 두 칸을 차지하게 만드세요.
  </div>

  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>
</body>
</html>

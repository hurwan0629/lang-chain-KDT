<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1단계 - Flexbox 기초</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #f5f7fb;
    }

    h1 {
      margin-top: 0;
    }

    .guide {
      max-width: 700px;
      padding: 16px;
      margin-bottom: 24px;
      border-left: 5px solid #2563eb;
      background-color: white;
      line-height: 1.7;
    }

    .container {
      width: 700px;
      height: 350px;
      border: 3px solid #222;
      background-color: white;

      /* 실습 1: 이곳에 display 속성을 작성하세요. */
      display: flex;
      flex-direction: row;
      /* 실습 2: 상자 사이의 간격을 20px로 만드세요. */
      flex-wrap: wrap;
      gap: 20px;


      justify-content: flex-start;
      align-items: center;
      /* align-content: center; */
    }

    .item {
      flex: 1 1 150px;
      height: 100px;
      border: 2px solid #1d4ed8;
      background-color: #93c5fd;
      font-size: 24px;
      font-weight: bold;

      display: flex;
      justify-content: center;
      align-items: center;
      /* margin: 30px; */
    }

    .item:nth-child(2) {
      flex-grow: 2;
    }

    .item:nth-child(4) {
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <h1>Flexbox 기초 실습</h1>

  <div class="guide">
    <strong>현재 과제</strong><br>
    1. 파란 상자 3개를 가로로 배치하세요.<br>
    2. 상자 사이에 20px 간격을 만드세요.<br>
    3. 아직 가운데 정렬은 하지 마세요.
  </div>

  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>
</body>
</html>

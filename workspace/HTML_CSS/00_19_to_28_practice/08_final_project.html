<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML/CSS 학습 대시보드</title>
  <style>
    :root {
      /* 1. 주요 색상, 배경색, 공통 간격 변수를 선언하세요. */
      --primary-color: #4f46e5;
      --background-color: #f1f5f9;
      --spacing: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1e293b;
      background-color: var(--background-color);
    }

    .page {
      min-height: 100vh;

      /* 2. header, main, footer로 구성된 Grid를 만드세요. */
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: var(--spacing);
      background-color: var(--primary-color);
      color: white;

      /* 3. 제목과 nav를 양쪽에 배치하는 Flexbox를 만드세요. */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    nav {
      /* 4. 메뉴들을 가로로 배치하고 간격을 만드세요. */
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 40px var(--spacing);
    }

    .intro {
      margin-bottom: 30px;
    }

    .course-list {
      /* 5. 최소 220px인 반응형 카드 Grid를 만드세요. */
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--spacing);
    }

    .course-card {
      padding: var(--spacing);
      border-top: 5px solid var(--primary-color);
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      cursor: pointer;

      /* 6. transform과 box-shadow에 Transition을 설정하세요. */
    }

    .course-card:hover {
      /* 7. 카드를 위로 8px 이동하고 1.03배 확대하세요. */
      box-shadow: 0 14px 25px rgba(15, 23, 42, 0.22);
    }

    .course-card h2 {
      color: var(--primary-color);
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background-color: #dcfce7;
      color: #166534;
      font-size: 14px;
    }

    footer {
      padding: var(--spacing);
      background-color: #1e293b;
      color: white;
      text-align: center;
    }

    /* 8. 767px 이하에서 header를 세로로 배치하세요.
          main의 위아래 여백도 24px로 줄이세요. */
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>HTML/CSS 학습 대시보드</h1>

      <nav>
        <a href="#">홈</a>
        <a href="#">강의</a>
        <a href="#">실습</a>
      </nav>
    </header>

    <main>
      <section class="intro">
        <h2>학습 과정</h2>
        <p>지금까지 공부한 CSS 주제를 확인해 보세요.</p>
      </section>

      <section class="course-list">
        <article class="course-card">
          <span class="status">완료</span>
          <h2>Flexbox</h2>
          <p>한 방향 배치와 정렬</p>
        </article>

        <article class="course-card">
          <span class="status">완료</span>
          <h2>Grid</h2>
          <p>행과 열을 사용하는 레이아웃</p>
        </article>

        <article class="course-card">
          <span class="status">완료</span>
          <h2>반응형 웹</h2>
          <p>화면 너비에 따른 스타일 변경</p>
        </article>

        <article class="course-card">
          <span class="status">완료</span>
          <h2>CSS 변수</h2>
          <p>반복되는 스타일 값 관리</p>
        </article>

        <article class="course-card">
          <span class="status">완료</span>
          <h2>Transition</h2>
          <p>부드러운 상태 변화</p>
        </article>

        <article class="course-card">
          <span class="status">완료</span>
          <h2>Transform</h2>
          <p>이동, 확대, 회전 효과</p>
        </article>
      </section>
    </main>

    <footer>HTML/CSS Practice Project</footer>
  </div>
</body>
</html>
